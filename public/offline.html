<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sem internet · MA Sorteio</title>
    <style>
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #1b1430; color: #fff; font-family: system-ui, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
      .caixa { max-width: 320px; display: flex; flex-direction: column; gap: 14px; align-items: center; }
      .logo { width: 64px; height: 64px; border-radius: 18px; background: #7444d6; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 22px; }
      h1 { margin: 0; font-size: 24px; }
      p { margin: 0; color: #cfc7e0; line-height: 1.5; }
      button { height: 48px; border: 0; border-radius: 14px; background: #7444d6; color: #fff; font-size: 16px; font-weight: 600; padding: 0 22px; }
    </style>
  </head>
  <body>
    <div class="caixa">
      <div class="logo">MA</div>
      <h1>Sem internet agora</h1>
      <p>Assim que a conexão voltar, o app continua de onde parou. As ações do placar ficam guardadas e são enviadas sozinhas.</p>
      <button onclick="location.reload()">Tentar de novo</button>
    </div>
  </body>
</html>
