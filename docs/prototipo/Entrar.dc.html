<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Entrar no MA Sorteio</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#7444D6}a:hover{color:#4F2A9E}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F6F4FA; font-family: Inter, system-ui, sans-serif; color: #121412">
  <div style="height: 360px; background: #1B1430; color: #fff; display: flex; flex-direction: column; justify-content: flex-end; padding: 0 24px 32px; gap: 10px">
    <div style="width: 64px; height: 64px; border-radius: 18px; background: #7444D6; display: flex; align-items: center; justify-content: center">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h4l10 12h4M3 18h4l3-3.6M14 9.6 17 6h4M18 3l3 3-3 3M18 15l3 3-3 3"/></svg>
    </div>
    <span style="font-family: 'Space Grotesk', sans-serif; font-size: 34px; font-weight: 700; letter-spacing: -0.5px">MA <span style="color: #C9B2FF">Sorteio</span></span>
    <span style="font-size: 15px; color: #CFC7E0">Times equilibrados, placar ao vivo e o campeonato da sua pelada.</span>
  </div>

  <div style="padding: 24px; display: flex; flex-direction: column; gap: 12px">
    <button style="height: 54px; border-radius: 14px; border: 1.5px solid #D8D0E6; background: #fff; font: inherit; font-size: 16px; font-weight: 600; color: #121412; display: flex; align-items: center; justify-content: center; gap: 10px">
      <span aria-hidden="true" style="width: 22px; height: 22px; border-radius: 11px; border: 1.5px solid #121412; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700">G</span>
      Entrar com Google
    </button>
    <button onClick="{{ toggleEmail }}" style="height: 54px; border-radius: 14px; border: none; background: #7444D6; color: #fff; font: inherit; font-size: 16px; font-weight: 600">Entrar com e-mail e senha</button>

    <sc-if value="{{ showEmail }}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600">E-mail
          <input type="email" placeholder="voce@email.com" style="height: 46px; border-radius: 12px; border: 1px solid #D8D0E6; padding: 0 12px; font: inherit; font-size: 15px; background: #fff">
        </label>
        <label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600">Senha
          <input type="password" placeholder="Senha que o admin te passou" style="height: 46px; border-radius: 12px; border: 1px solid #D8D0E6; padding: 0 12px; font: inherit; font-size: 15px; background: #fff">
        </label>
      </div>
    </sc-if>

    <a href="AoVivo.dc.html" style="display: flex; align-items: center; justify-content: center; height: 48px; font-size: 15px; font-weight: 600; text-decoration: none">Só acompanhar, sem entrar</a>

    <div style="display: flex; align-items: center; gap: 12px; background: #EFE8FC; border-radius: 14px; padding: 12px 14px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4F2A9E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="2" width="12" height="20" rx="2.5"/><path d="M12 8v6M9 11l3 3 3-3"/></svg>
      <span style="flex: 1; font-size: 13px; color: #4F2A9E"><strong>Instale o app</strong> na tela inicial: abre direto e você continua logado.</span>
      <button style="height: 36px; padding: 0 12px; border-radius: 10px; border: none; background: #4F2A9E; color: #fff; font: inherit; font-size: 13px; font-weight: 600">Instalar</button>
    </div>

    <span style="font-size: 12px; color: #5B5570; text-align: center">Quem entra com Google vira jogador. O master pode promover a admin de uma pelada.</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { email: false }; }
  renderVals() {
    return { showEmail: this.state.email, toggleEmail: () => this.setState({ email: !this.state.email }) };
  }
}
</script>
</body>
</html>
